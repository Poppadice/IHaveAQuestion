<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey, I Have a Question</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>

    <div class="scene">
        <div class="dialogue visible" id="line1">Hey, I have something I want to ask you.</div>
        <div class="dialogue" id="line2">I've been thinking about this for a while and I've really been wondering . . .</div>
        <div class="question" id="question">Would you like to be my girlfriend?</div>
        <div class="answers" id="answers">
            <button class="answer-btn yes-btn" id="yes-btn">Yes</button>
            <button class="answer-btn no-btn" id="no-btn">No</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
